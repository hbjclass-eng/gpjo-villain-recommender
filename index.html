<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디즈니 악당 빅데이터 테스트(급조)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", Arial, sans-serif;
    background: linear-gradient(135deg, #151522, #29203a);
    color: #f5f3f8;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: auto; padding: 36px 20px 60px; }
  .hero {
    text-align: center; padding: 30px 20px; margin-bottom: 24px;
    background: rgba(255,255,255,.08); border-radius: 24px;
    border: 1px solid rgba(255,255,255,.12);
  }
  h1 { margin: 0 0 10px; font-size: 2.2rem; }
  .subtitle { color: #cfc9db; margin: 0; line-height: 1.6; }
  .progress-wrap {
    position: sticky; top: 0; z-index: 5; padding: 12px 0;
    background: rgba(21,21,34,.94); backdrop-filter: blur(8px);
  }
  .progress {
    height: 10px; background: #494255; border-radius: 99px; overflow: hidden;
  }
  .progress-bar { height: 100%; width: 0%; background: #d7a8ff; transition: width .25s; }
  .progress-text { font-size: .9rem; color: #cfc9db; margin-top: 7px; text-align: right; }
  .question {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px; padding: 22px; margin: 16px 0;
  }
  .q-title { font-weight: 700; line-height: 1.55; margin-bottom: 15px; }
  .axis { color: #d7a8ff; font-size: .82rem; margin-bottom: 12px; }
  .scale { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
  .score {
    border: 1px solid #665d73; background: #2a2633; color: #f5f3f8;
    border-radius: 10px; padding: 11px 5px; cursor: pointer; font-weight: 700;
    transition: .15s;
  }
  .score:hover { transform: translateY(-2px); border-color: #d7a8ff; }
  .score.selected { background: #d7a8ff; color: #21182b; border-color: #d7a8ff; }
  .scale-labels {
    display: flex; justify-content: space-between; font-size: .75rem;
    color: #aaa2b6; margin-top: 7px;
  }
  .actions { text-align: center; margin-top: 28px; }
  button.main {
    border: 0; border-radius: 14px; padding: 15px 28px; font-size: 1rem;
    font-weight: 800; cursor: pointer; background: #d7a8ff; color: #21182b;
  }
  button.main:hover { filter: brightness(1.08); }
  .error { color: #ffb8b8; margin-top: 12px; display: none; }
  #result { display: none; }
  .result-card {
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.13);
    border-radius: 24px; padding: 30px; text-align: center; margin-top: 24px;
  }
  .winner { font-size: 2.1rem; font-weight: 900; margin: 10px 0; color: #f1cfff; }
  .nickname { color: #d2cadc; margin-bottom: 20px; }
  .scores { margin-top: 22px; text-align: left; }
  .score-row { margin: 13px 0; }
  .row-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .bar-bg { height: 10px; background: #494255; border-radius: 99px; overflow: hidden; }
  .bar { height: 100%; background: #d7a8ff; border-radius: 99px; }
  .ranking { margin-top: 28px; text-align: left; }
  .rank-item {
    display: flex; justify-content: space-between; padding: 12px 14px;
    margin: 7px 0; border-radius: 12px; background: rgba(255,255,255,.06);
  }
  .method {
    margin-top: 22px; padding: 16px; border-radius: 14px;
    background: rgba(255,255,255,.05); color: #cfc9db; line-height: 1.65;
    font-size: .9rem;
  }
  .restart { margin-top: 20px; }
  @media (max-width: 600px) {
    h1 { font-size: 1.7rem; }
    .container { padding: 22px 12px 40px; }
    .question { padding: 17px; }
    .scale { gap: 4px; }
    .score { padding: 10px 2px; }
  }
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <h1>🖤 디즈니 악당 빅데이터 테스트(급조)</h1>
    <p class="subtitle">
      15개의 질문에 1~7점으로 답하고<br>
      8가지 성격축을 바탕으로 나와 가장 비슷한 디즈니 악당을 찾아보세요.
    </p>
  </section>

  <div class="progress-wrap">
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">0 / 15 응답</div>
  </div>

  <main id="quiz"></main>

  <div class="actions">
    <button class="main" id="resultBtn">내 악당 알아보기</button>
    <div class="error" id="error">모든 문항에 답해주세요!</div>
  </div>

  <section id="result">
    <div class="result-card">
      <div>당신과 가장 유사한 악당은</div>
      <div class="winner" id="winner"></div>
      <div class="nickname" id="nickname"></div>

      <div class="scores" id="userAxes"></div>
      <div class="ranking" id="ranking"></div>

      <div class="method">
        <b>판정 방법</b><br>
        15개 답변을 8개 성격축(경쟁심·목표집착·즉흥성·통제성·계산성·공감성·대담성·감정기복)으로 변환한 뒤,
        각 악당의 성격 벡터와 <b>코사인 유사도</b>를 계산했습니다.
        값이 1에 가까울수록 성향 벡터의 방향이 비슷합니다.
      </div>

      <button class="main restart" onclick="location.reload()">다시 테스트하기</button>
    </div>
  </section>
</div>

<script>
const questions = [
  ["다른 사람과 경쟁할 때, 상대보다 더 좋은 결과를 얻고 싶은 마음이 강하다.", "경쟁심"],
  ["한 번 세운 목표는 중간에 어려움이 생겨도 끝까지 이루려고 하는 편이다.", "목표집착"],
  ["갑작스럽게 좋은 기회가 생기면 충분히 생각하기보다 일단 행동으로 옮기는 편이다.", "즉흥성"],
  ["여러 사람이 함께하는 상황에서는 내가 원하는 방향으로 상황을 이끌고 싶어 하는 편이다.", "통제성"],
  ["중요한 결정을 내릴 때 감정보다 상황의 이득과 손해를 먼저 따져보는 편이다.", "계산성"],
  ["다른 사람의 입장이나 감정을 쉽게 이해하고 공감하는 편이다.", "공감성"],
  ["실패할 가능성이 있더라도 해보고 싶다는 생각이 들면 과감하게 도전하는 편이다.", "대담성"],
  ["내 기분은 주변 상황에 따라 크게 달라지는 편이다.", "감정기복"],
  ["다른 사람이 나보다 뛰어난 성과를 내면 나도 더 잘하고 싶다는 경쟁심이 생긴다.", "경쟁심"],
  ["목표를 이루는 과정이 예상보다 힘들어지더라도 포기하기보다는 방법을 바꿔서 계속하려 한다.", "목표집착"],
  ["계획했던 일이 갑자기 바뀌어도 새로운 상황에 맞춰 바로 행동을 바꾸는 편이다.", "즉흥성"],
  ["내가 직접 결정하고 다른 사람들이 그 결정에 따라 움직이는 상황을 편하게 느낀다.", "통제성"],
  ["사람을 설득하거나 어떤 일을 결정할 때, 앞으로 일어날 결과를 미리 계산하는 편이다.", "계산성"],
  ["내가 손해를 볼 가능성이 있더라도 다른 사람을 위해 행동할 수 있는 편이다.", "공감성"],
  ["결과가 확실하지 않아도 성공했을 때 얻을 것이 크다면 위험을 감수할 수 있다.", "대담성"]
];

const villains = {
  "한스":       {nickname:"미소 뒤에 숨은 왕좌", v:[6,6,2,5,6,3,5,2]},
  "트레메인 부인": {nickname:"신데렐라를 짓누른 계모", v:[5,5,2,6,6,2,2,3]},
  "후크 선장":   {nickname:"피터 팬의 영원한 숙적", v:[5,3,6,4,3,3,6,6]},
  "스카":       {nickname:"왕좌를 노린 그림자", v:[6,7,2,6,7,2,4,4]},
  "마더 고델":   {nickname:"사랑으로 묶은 감옥", v:[3,6,2,7,6,2,3,5]},
  "자파":       {nickname:"권력을 향한 마법", v:[6,6,3,6,7,2,5,3]},
  "크루엘라":    {nickname:"광기를 입은 패션가", v:[6,6,7,4,4,2,6,7]},
  "이블 퀸":     {nickname:"아름다움에 사로잡힌 여왕", v:[7,5,4,6,5,2,4,6]},
  "우르술라":    {nickname:"욕망을 낚는 바다의 마녀", v:[5,6,5,5,7,3,6,5]},
  "말레피센트":  {nickname:"저주받은 복수의 요정", v:[3,5,4,4,3,4,6,6]}
};

const axes = ["경쟁심","목표집착","즉흥성","통제성","계산성","공감성","대담성","감정기복"];
const answers = Array(questions.length).fill(null);
const quiz = document.getElementById("quiz");

questions.forEach((q, i) => {
  const div = document.createElement("section");
  div.className = "question";
  div.innerHTML = `
    <div class="q-title">${i+1}. ${q[0]}</div>
    <div class="scale">
      ${Array.from({length:7}, (_,s) => { const score = s + 1; return `<button class="score" data-q="${i}" data-score="${score}">${score}</button>`; }).join("")}
    </div>
    <div class="scale-labels"><span>1 = 전혀 그렇지 않다</span><span>4 = 보통이다</span><span>7 = 매우 그렇다</span></div>
  `;
  quiz.appendChild(div);
});

document.querySelectorAll(".score").forEach(btn => {
  btn.addEventListener("click", () => {
    const q = Number(btn.dataset.q);
    const score = Number(btn.dataset.score);
    answers[q] = score;
    document.querySelectorAll(`.score[data-q="${q}"]`).forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    updateProgress();
  });
});

function updateProgress() {
  const count = answers.filter(x => x !== null).length;
  document.getElementById("progressText").textContent = `${count} / 15 응답`;
  document.getElementById("progressBar").style.width = `${count / 15 * 100}%`;
}

function makeUserVector() {
  const groups = axes.map(axis => []);
  questions.forEach((q, i) => {
    groups[axes.indexOf(q[1])].push(answers[i]);
  });
  return groups.map(g => g.reduce((a,b) => a+b, 0) / g.length);
}

function cosine(a,b) {
  let dot=0, na=0, nb=0;
  for(let i=0;i<a.length;i++) {
    dot += a[i]*b[i];
    na += a[i]*a[i];
    nb += b[i]*b[i];
  }
  return (na && nb) ? dot / (Math.sqrt(na)*Math.sqrt(nb)) : 0;
}

document.getElementById("resultBtn").addEventListener("click", () => {
  const error = document.getElementById("error");
  if (answers.some(x => x === null)) {
    error.style.display = "block";
    const first = answers.findIndex(x => x === null);
    document.querySelectorAll(".question")[first].scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  error.style.display = "none";

  const user = makeUserVector();
  const ranking = Object.entries(villains)
    .map(([name,data]) => ({name, nickname:data.nickname, similarity:cosine(user,data.v)}))
    .sort((a,b)=>b.similarity-a.similarity);

  document.getElementById("winner").textContent = ranking[0].name;
  document.getElementById("nickname").textContent = ranking[0].nickname;

  document.getElementById("userAxes").innerHTML =
    "<h3>나의 8가지 성격축</h3>" +
    user.map((v,i)=>`
      <div class="score-row">
        <div class="row-head"><span>${axes[i]}</span><b>${v.toFixed(1)} / 7</b></div>
        <div class="bar-bg"><div class="bar" style="width:${v/7*100}%"></div></div>
      </div>`).join("");

  document.getElementById("ranking").innerHTML =
    "<h3>악당별 코사인 유사도</h3>" +
    ranking.map((r,i)=>`
      <div class="rank-item">
        <span>${i+1}. ${r.name}</span>
        <b>${r.similarity.toFixed(4)}</b>
      </div>`).join("");

  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
});
</script>
</body>
</html>
